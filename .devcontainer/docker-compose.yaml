services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    volumes:
      - ../:/ws:cached
    command: sleep infinity
    depends_on:
      - postgres

  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: development
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
